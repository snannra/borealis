[workspace]
members = [
    "crates/node",
    "crates/protocol",
    "services/coordinator",
]
default-members = ["crates/node"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
borealis-protocol = { path = "crates/protocol" }
boringtun = "0.7.1"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tun = "0.8.14"
